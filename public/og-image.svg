<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#2a2823" stroke-width="1"/>
    </pattern>
    <pattern id="scanline" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0d0d0b"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- top chrome -->
  <rect x="0" y="0" width="1200" height="56" fill="#141311"/>
  <rect x="0" y="55" width="1200" height="1" fill="#2a2823"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
    <text x="32" y="35" fill="#b5ff3a">▮</text>
    <text x="58" y="35" fill="#e6e3d8">kamil@portfolio</text>
    <text x="216" y="35" fill="#44413a">:~$</text>
    <text x="252" y="35" fill="#6e6a5e">whoami --verbose</text>
    <text x="1090" y="35" fill="#b5ff3a">● ONLINE</text>
  </g>

  <!-- prompt line -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="15">
    <text x="72" y="142" fill="#b5ff3a">&gt;</text>
    <text x="96" y="142" fill="#6e6a5e">cat ./identity.txt</text>
  </g>

  <!-- name -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-weight="700" font-size="128" letter-spacing="-3">
    <text x="72" y="310" fill="#e6e3d8">KAMIL</text>
    <text x="72" y="430" fill="#e6e3d8">KURDZIEL<tspan fill="#b5ff3a">_</tspan></text>
  </g>

  <!-- role line -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="24">
    <text x="72" y="490" fill="#b5ff3a">#</text>
    <text x="102" y="490" fill="#e6e3d8">.NET Lead Engineer | Mentor &amp; CTO</text>
  </g>

  <!-- tagline -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" fill="#6e6a5e">
    <text x="72" y="545">Skalowalne systemy backendowe. Zespoły inżynierskie.</text>
    <text x="72" y="570">AI w produkcie i w codziennym procesie tworzenia oprogramowania.</text>
  </g>

  <!-- bottom stripe -->
  <rect x="0" y="605" width="1200" height="1" fill="#2a2823"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#6e6a5e">
    <text x="32" y="623">// kamil@portfolio · kamilkurdziel.me</text>
    <text x="1090" y="623" fill="#b5ff3a">BOOKED</text>
  </g>

  <!-- scanlines overlay -->
  <rect width="1200" height="630" fill="url(#scanline)" opacity="0.35"/>
</svg>
