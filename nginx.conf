server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ─────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ── Security headers ────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # ── Astro hashed assets: cache forever ──────────────
  location ^~ /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # ── Other static assets: cache 30 days ──────────────
  location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # ── HTML: no cache so updates propagate ─────────────
  location ~* \.html$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    try_files $uri =404;
  }

  # ── Default: try static, fallback to directory index ─
  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # ── Silence common noise ────────────────────────────
  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }
}
